<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #form {
            
            background: linear-gradient(to right,#FFEDD1,#FDC1B4);
            }
                 input,td{

            font-family: helvetica;

            font-size:25px;

        }
        td, th {
            padding-top: 12px;
            padding-bottom: 12px;
                }
            h1{
                color:chocolate;
                background: linear-gradient(to right,#FFEDD1,#FDC1B4);
            }
    </style>
</head>
<body>    
    <center>
    <h1>Contact us</h1>
    <div id="form">
            <table>
                <tr>
                    <td>First Name</td>
                    <td><input type="text" placeholder="Enter First name">  </td>
                    <td>Last Name</td>
                    <td><input type="text" placeholder="Enter Last name">  </td>
                </tr>
                <tr>
                    <td>Phone Number</td>
                    <td><input type="number" placeholder="Ener your Number"></td>
                    <td>Email Id</td>
                    <td><input type="email" placeholder="Enter your Email Id"></td>
                </tr>      
                <td>Message</td>   
            </table>    
                    <textarea id="message" name="message" 
                    rows="10" cols="90" placeholder="Type your message here..."></textarea>
            <table>
                <tr>
                    <td></td><td><input type="submit"></td>
                </tr><br><br>                
            </table>
    </div>
    </center>
</body>
</html>
